<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Script interno</title>
</head>
<body>
  <h1>Exemplo com script interno</h1>
  <button onclick="mostrarMensagem()">Clique aqui</button>

  <script>
    function mostrarMensagem() {
      alert("Olá! Este script está dentro do próprio HTML.");
    }
  </script>
</body>
</html>
