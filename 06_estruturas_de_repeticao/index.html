
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura de repetição</title>
</head>
<body>
<script>
    <!--for-->
    for (let i = 0; i < 5; i++) {
  console.log("Número: " + i);
}
</script>

<script>
    <!--while-->
let i = 0;

while (i < 5) {
  console.log("Número: " + i);
  i++;
}
</script>
</body>
</html>
